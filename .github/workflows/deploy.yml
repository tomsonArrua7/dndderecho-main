name: Deploy to DonWeb VPS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (git pull + build en servidor)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.58.102.187
          username: root
          password: ${{ secrets.DEPLOY_ROOT_PASSWORD }}
          port: 22
          script: |
            git config --global --add safe.directory /home/dndjursoc/htdocs/dndjursoc.com.ar
            cd /home/dndjursoc/htdocs/dndjursoc.com.ar
            if [ ! -d ".git" ]; then
              echo "No .git folder found. Reinitializing repository..."
              git init
              git remote add origin https://github.com/tomsonArrua7/dndderecho-main.git
              git fetch
              git checkout -f master
            else
              git pull origin master
            fi
            npm ci --prefer-offline 2>/dev/null || npm install
            npm run build
            mkdir -p templates && cp -r dist/templates/* templates/ 2>/dev/null || true
            cp -r supabase/functions/mass-mailing /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/send-match-email /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/calendario-ics /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/send-recovery-email /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/asistente /root/supabase/docker/volumes/functions/
            echo "Deploy completado: $(git log --oneline -1)"




