name: Deploy to DonWeb VPS

on:
  push:
    branches:
      - master # O el nombre de tu rama principal (ej. master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          # Si necesitas inyectar variables de entorno en la compilación, colócalas aquí.
          # NOTA: Supabase URL y ANON KEY deben estar accesibles para la app de Vite.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy via SFTP (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER }} # IP del VPS (ej. 200.58.102.187)
          username: ${{ secrets.DEPLOY_USERNAME }} # Usuario del sitio (ej. dndjursoc)
          password: ${{ secrets.DEPLOY_PASSWORD }} # Contraseña del usuario
          port: 22 # Puerto SSH estándar
          source: "dist/*,dist/**" # Selecciona todo lo que esté dentro de la carpeta dist/
          target: "/home/dndjursoc/htdocs/dndjursoc.com.ar/" # Directorio absoluto del sitio
          strip_components: 1 # Elimina la carpeta "dist/" al subir, dejando solo su contenido en la raíz
