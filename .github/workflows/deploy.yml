name: Deploy to DonWeb VPS

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build in GitHub Cloud (16GB RAM)
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: "https://api.dndjursoc.com.ar"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_r-nXAS_Axj91S29dmzJk5Q_FD6h2rF6"
          VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAD5z1Imm9ecQi4tW"

      - name: Compress dist bundle
        run: |
          tar -czf dist.tar.gz dist/

      - name: Upload bundle to DonWeb VPS (0% RAM on VPS)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 200.58.102.187
          username: root
          password: ${{ secrets.DEPLOY_ROOT_PASSWORD }}
          port: 5696
          source: "dist.tar.gz"
          target: "/home/dndjursoc/htdocs/dndjursoc.com.ar/"

      - name: Extract & finalize on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.58.102.187
          username: root
          password: ${{ secrets.DEPLOY_ROOT_PASSWORD }}
          port: 5696
          timeout: 60s
          script: |
            cd /home/dndjursoc/htdocs/dndjursoc.com.ar
            tar -xzf dist.tar.gz
            cp -r dist/* .
            rm -rf dist.tar.gz
            echo "DEPLOY FINISHED AT $(date)" > dist/deploy-status.txt

            # Auto-run SQL migrations on PostgreSQL container
            DB_CONTAINER=$(docker ps -q -f ancestor=supabase/postgres | head -n 1)
            if [ -z "$DB_CONTAINER" ]; then
              DB_CONTAINER=$(docker ps -q -f name=supabase-db | head -n 1)
            fi
            if [ -n "$DB_CONTAINER" ]; then
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "ALTER TABLE public.app_settings ADD COLUMN IF NOT EXISTS personas_permutadas_count integer DEFAULT 0; GRANT ALL ON TABLE public.app_settings TO postgres, anon, authenticated, service_role;" 2>/dev/null || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE TABLE IF NOT EXISTS public.permutas_historico_periodos (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), nombre_periodo TEXT NOT NULL, fecha_inicio TIMESTAMPTZ NOT NULL DEFAULT now(), fecha_cierre TIMESTAMPTZ NOT NULL DEFAULT now(), total_permutas INT NOT NULL DEFAULT 0, total_realizadas INT NOT NULL DEFAULT 0, total_activas INT NOT NULL DEFAULT 0, total_canceladas INT NOT NULL DEFAULT 0, personas_beneficiadas INT NOT NULL DEFAULT 0, stats_por_anio JSONB NOT NULL DEFAULT '{}'::jsonb, stats_por_materia JSONB NOT NULL DEFAULT '[]'::jsonb, stats_comisiones JSONB NOT NULL DEFAULT '{}'::jsonb, raw_data_backup JSONB DEFAULT '[]'::jsonb, created_at TIMESTAMPTZ NOT NULL DEFAULT now()); GRANT ALL ON TABLE public.permutas_historico_periodos TO postgres, anon, authenticated, service_role;" 2>/dev/null || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "NOTIFY pgrst, 'reload schema';" 2>/dev/null || true
            fi
            echo "Deploy completado con éxito."




