name: Deploy to DonWeb VPS

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (git pull + build con claves del VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.58.102.187
          username: root
          password: ${{ secrets.DEPLOY_ROOT_PASSWORD }}
          port: 5696
          timeout: 300s
          script: |
            echo "DEPLOY START: $(date)" > /home/dndjursoc/htdocs/dndjursoc.com.ar/deploy-status.txt 2>/dev/null || true
            killall -9 node 2>/dev/null || true
            rm -f /home/dndjursoc/htdocs/dndjursoc.com.ar/.git/index.lock 2>/dev/null || true
            git config --global --add safe.directory '*'
            cd /home/dndjursoc/htdocs/dndjursoc.com.ar
            rm -f .git/index.lock 2>/dev/null || true
            
            echo "STEP 1: GIT FETCH & RESET"
            git fetch origin master
            git reset --hard origin/master
            git clean -fd

            echo "STEP 2: ENV & DOCKER CHECK"
            if [ -f "/root/supabase/docker/.env" ]; then
              LOCAL_ANON_KEY=$(grep '^ANON_KEY=' /root/supabase/docker/.env | cut -d'=' -f2- | tr -d '"\r\n' | sed 's/^"//;s/"$//')
              if [ -n "$LOCAL_ANON_KEY" ]; then
                echo "VITE_SUPABASE_URL=\"https://api.dndjursoc.com.ar\"" > .env
                echo "VITE_SUPABASE_ANON_KEY=\"$LOCAL_ANON_KEY\"" >> .env
                echo "VITE_TURNSTILE_SITE_KEY=\"0x4AAAAAAD5z1Imm9ecQi4tW\"" >> .env
              fi
            fi

            echo "STEP 3: BUILD"
            rm -rf dist assets 2>/dev/null || true
            sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            NODE_OPTIONS="--max-old-space-size=512" npm run build >> deploy-status.txt 2>&1 || (npm install && NODE_OPTIONS="--max-old-space-size=512" npm run build >> deploy-status.txt 2>&1)
            sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true

            echo "STEP 4: COPY DIST FILES & FIX PERMISSIONS"
            cp -r dist/* .
            mkdir -p dist
            cp -r index.html assets dist/ 2>/dev/null || true
            chmod -R 755 /home/dndjursoc/htdocs/dndjursoc.com.ar/
            chown -R dndjursoc:dndjursoc /home/dndjursoc/htdocs/dndjursoc.com.ar/ 2>/dev/null || chown -R www-data:www-data /home/dndjursoc/htdocs/dndjursoc.com.ar/ 2>/dev/null || true
            echo "DEPLOY FINISHED AT $(date) - ACTIVE BUNDLE: $(ls assets/index-*.js 2>/dev/null)" >> deploy-status.txt
            cp deploy-status.txt dist/deploy-status.txt 2>/dev/null || true

            # Auto-run SQL migrations on PostgreSQL container
            DB_CONTAINER=$(docker ps -q -f ancestor=supabase/postgres | head -n 1)
            if [ -z "$DB_CONTAINER" ]; then
              DB_CONTAINER=$(docker ps -q -f name=supabase-db | head -n 1)
            fi
            if [ -n "$DB_CONTAINER" ]; then
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "ALTER TABLE public.app_settings ADD COLUMN IF NOT EXISTS personas_permutadas_count integer DEFAULT 0; GRANT ALL ON TABLE public.app_settings TO postgres, anon, authenticated, service_role;" 2>/dev/null || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE TABLE IF NOT EXISTS public.permutas_historico_periodos (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), nombre_periodo TEXT NOT NULL, fecha_inicio TIMESTAMPTZ NOT NULL DEFAULT now(), fecha_cierre TIMESTAMPTZ NOT NULL DEFAULT now(), total_permutas INT NOT NULL DEFAULT 0, total_realizadas INT NOT NULL DEFAULT 0, total_activas INT NOT NULL DEFAULT 0, total_canceladas INT NOT NULL DEFAULT 0, personas_beneficiadas INT NOT NULL DEFAULT 0, stats_por_anio JSONB NOT NULL DEFAULT '{}'::jsonb, stats_por_materia JSONB NOT NULL DEFAULT '[]'::jsonb, stats_comisiones JSONB NOT NULL DEFAULT '{}'::jsonb, raw_data_backup JSONB DEFAULT '[]'::jsonb, created_at TIMESTAMPTZ NOT NULL DEFAULT now()); GRANT ALL ON TABLE public.permutas_historico_periodos TO postgres, anon, authenticated, service_role;" 2>/dev/null || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE TABLE IF NOT EXISTS public.instagram_feed (id TEXT PRIMARY KEY, media_type TEXT NOT NULL DEFAULT 'IMAGE', media_url TEXT NOT NULL, thumbnail_url TEXT, permalink TEXT NOT NULL DEFAULT 'https://www.instagram.com/agrupaciondnd/', caption TEXT, timestamp TIMESTAMPTZ NOT NULL DEFAULT now(), like_count INT DEFAULT 0, comments_count INT DEFAULT 0, created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now()); GRANT ALL ON TABLE public.instagram_feed TO postgres, anon, authenticated, service_role;" 2>/dev/null || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE TABLE IF NOT EXISTS public.instagram_config (id INT PRIMARY KEY DEFAULT 1, access_token TEXT, instagram_user_id TEXT, last_token_refresh TIMESTAMPTZ DEFAULT now(), last_sync_at TIMESTAMPTZ, last_error TEXT, created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now(), CONSTRAINT single_config_row CHECK (id = 1)); INSERT INTO public.instagram_config (id, access_token, last_token_refresh) VALUES (1, NULL, now()) ON CONFLICT (id) DO NOTHING; GRANT ALL ON TABLE public.instagram_config TO postgres, anon, authenticated, service_role;" 2>/dev/null || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "NOTIFY pgrst, 'reload schema';" 2>/dev/null || true
            fi

            mkdir -p /root/supabase/docker/volumes/functions/sync-instagram-feed 2>/dev/null || true
            cp -r supabase/functions/sync-instagram-feed/* /root/supabase/docker/volumes/functions/sync-instagram-feed/ 2>/dev/null || true

            echo "Deploy completado con éxito."




