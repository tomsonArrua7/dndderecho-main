name: Deploy to DonWeb VPS

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (git pull + build en servidor)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.58.102.187
          username: root
          password: ${{ secrets.DEPLOY_ROOT_PASSWORD }}
          port: 5696
          timeout: 600s
          script: |
            echo "DEPLOY START: $(date)" > /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>/dev/null || true
            pkill -f "vite build" 2>/dev/null || true
            pkill -f "npm run build" 2>/dev/null || true
            git config --global --add safe.directory '*'
            cd /home/dndjursoc/htdocs/dndjursoc.com.ar
            
            echo "STEP 1: GIT FETCH & RESET" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>/dev/null || true
            git fetch origin master
            git reset --hard origin/master
            git clean -fd

            echo "STEP 2: ENV & DOCKER CHECK" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>/dev/null || true
            if [ -f "/root/supabase/docker/.env" ]; then
              LOCAL_ANON_KEY=$(grep '^ANON_KEY=' /root/supabase/docker/.env | cut -d'=' -f2- | tr -d '"\r\n' | sed 's/^"//;s/"$//')
              if [ -n "$LOCAL_ANON_KEY" ]; then
                echo "VITE_SUPABASE_URL=\"https://api.dndjursoc.com.ar\"" > .env
                echo "VITE_SUPABASE_ANON_KEY=\"$LOCAL_ANON_KEY\"" >> .env
                echo "VITE_TURNSTILE_SITE_KEY=\"0x4AAAAAAD5z1Imm9ecQi4tW\"" >> .env
              fi
            fi

            # Auto-run SQL enum update if DB container is running
            # Auto-run SQL updates on PostgreSQL database container
            DB_CONTAINER=$(docker ps -q -f ancestor=supabase/postgres | head -n 1)
            REST_CONTAINER=$(docker ps -q -f ancestor=postgrest/postgrest | head -n 1)
            if [ -z "$DB_CONTAINER" ]; then
              DB_CONTAINER=$(docker ps -q -f name=supabase-db | head -n 1)
            fi
            if [ -z "$REST_CONTAINER" ]; then
              REST_CONTAINER=$(docker ps -q -f name=supabase-rest | head -n 1)
            fi
            if [ -n "$DB_CONTAINER" ]; then
              echo "STEP 2.5: EXECUTING SQL MIGRATIONS ON DB ($DB_CONTAINER)" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>/dev/null || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "ALTER TYPE public.tipo_evento ADD VALUE IF NOT EXISTS 'academico';" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || docker exec "$DB_CONTAINER" psql -U postgres -d postgres -c "ALTER TYPE public.tipo_evento ADD VALUE IF NOT EXISTS 'academico';" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "ALTER TABLE public.app_settings ADD COLUMN IF NOT EXISTS personas_permutadas_count integer DEFAULT 0; GRANT ALL ON TABLE public.app_settings TO postgres, anon, authenticated, service_role;" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || docker exec "$DB_CONTAINER" psql -U postgres -d postgres -c "ALTER TABLE public.app_settings ADD COLUMN IF NOT EXISTS personas_permutadas_count integer DEFAULT 0;" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE OR REPLACE FUNCTION public.update_personas_permutadas_count(new_val integer) RETURNS integer LANGUAGE plpgsql SECURITY DEFINER SET search_path = public AS \$\$ BEGIN UPDATE public.app_settings SET personas_permutadas_count = new_val WHERE id = 1; IF NOT FOUND THEN INSERT INTO public.app_settings (id, personas_permutadas_count) VALUES (1, new_val); END IF; RETURN new_val; END \$\$; GRANT EXECUTE ON FUNCTION public.update_personas_permutadas_count(integer) TO anon, authenticated, service_role, postgres;" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE OR REPLACE FUNCTION public.increment_personas_permutadas(inc_val integer DEFAULT 2) RETURNS integer LANGUAGE plpgsql SECURITY DEFINER SET search_path = public AS \$\$ DECLARE new_count integer; BEGIN UPDATE public.app_settings SET personas_permutadas_count = COALESCE(personas_permutadas_count, 0) + inc_val WHERE id = 1 RETURNING personas_permutadas_count INTO new_count; IF NOT FOUND THEN INSERT INTO public.app_settings (id, personas_permutadas_count) VALUES (1, inc_val) RETURNING personas_permutadas_count INTO new_count; END IF; RETURN COALESCE(new_count, 0); END \$\$; GRANT EXECUTE ON FUNCTION public.increment_personas_permutadas(integer) TO anon, authenticated, service_role, postgres;" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE OR REPLACE FUNCTION public.get_completed_permutas_count() RETURNS bigint LANGUAGE plpgsql SECURITY DEFINER SET search_path = public AS \$\$ BEGIN RETURN COALESCE((SELECT personas_permutadas_count FROM public.app_settings WHERE id = 1), 0) + COALESCE((SELECT COUNT(*) FROM public.permutas WHERE status = 'realizada'), 0); END \$\$; GRANT EXECUTE ON FUNCTION public.get_completed_permutas_count() TO anon, authenticated, service_role, postgres;" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "CREATE TABLE IF NOT EXISTS public.permutas_historico_periodos (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), nombre_periodo TEXT NOT NULL, fecha_inicio TIMESTAMPTZ NOT NULL DEFAULT now(), fecha_cierre TIMESTAMPTZ NOT NULL DEFAULT now(), total_permutas INT NOT NULL DEFAULT 0, total_realizadas INT NOT NULL DEFAULT 0, total_activas INT NOT NULL DEFAULT 0, total_canceladas INT NOT NULL DEFAULT 0, personas_beneficiadas INT NOT NULL DEFAULT 0, stats_por_anio JSONB NOT NULL DEFAULT '{}'::jsonb, stats_por_materia JSONB NOT NULL DEFAULT '[]'::jsonb, stats_comisiones JSONB NOT NULL DEFAULT '{}'::jsonb, raw_data_backup JSONB DEFAULT '[]'::jsonb, created_at TIMESTAMPTZ NOT NULL DEFAULT now()); GRANT ALL ON TABLE public.permutas_historico_periodos TO postgres, anon, authenticated, service_role;" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || docker exec "$DB_CONTAINER" psql -U postgres -d postgres -c "CREATE TABLE IF NOT EXISTS public.permutas_historico_periodos (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), nombre_periodo TEXT NOT NULL, fecha_inicio TIMESTAMPTZ NOT NULL DEFAULT now(), fecha_cierre TIMESTAMPTZ NOT NULL DEFAULT now(), total_permutas INT NOT NULL DEFAULT 0, total_realizadas INT NOT NULL DEFAULT 0, total_activas INT NOT NULL DEFAULT 0, total_canceladas INT NOT NULL DEFAULT 0, personas_beneficiadas INT NOT NULL DEFAULT 0, stats_por_anio JSONB NOT NULL DEFAULT '{}'::jsonb, stats_por_materia JSONB NOT NULL DEFAULT '[]'::jsonb, stats_comisiones JSONB NOT NULL DEFAULT '{}'::jsonb, raw_data_backup JSONB DEFAULT '[]'::jsonb, created_at TIMESTAMPTZ NOT NULL DEFAULT now());" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || true
              docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -c "NOTIFY pgrst, 'reload schema';" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>&1 || true
            fi

            echo "STEP 3: NPM BUILD" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>/dev/null || true
            npm run build

            echo "STEP 4: COPY DIST FILES" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>/dev/null || true
            cp -r dist/* /home/dndjursoc/htdocs/dndjursoc.com.ar/ 2>/dev/null || true
            cp -r dist/* /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/ 2>/dev/null || true

            echo "DEPLOY FINISHED AT $(date)" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/deploy-status.txt 2>/dev/null || true
            mkdir -p /root/supabase/docker/volumes/functions/ 2>/dev/null || true
            cp -r supabase/functions/mass-mailing /root/supabase/docker/volumes/functions/ 2>/dev/null || true
            cp -r supabase/functions/send-match-email /root/supabase/docker/volumes/functions/ 2>/dev/null || true
            cp -r supabase/functions/calendario-ics /root/supabase/docker/volumes/functions/ 2>/dev/null || true
            cp -r supabase/functions/send-recovery-email /root/supabase/docker/volumes/functions/ 2>/dev/null || true
            cp -r supabase/functions/asistente /root/supabase/docker/volumes/functions/ 2>/dev/null || true
            # Copy docker-compose.yml for remote inspection
            cp /root/supabase/docker/docker-compose.yml /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-compose.yml 2>/dev/null || true
            # Copy filtered env file for inspection (removing secrets)
            grep -viE 'password|key|secret' /root/supabase/docker/.env > /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/supabase-env.txt 2>/dev/null || true
            # Copy docker compose up log
            cp /tmp/docker-up-log.txt /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-up-log.txt 2>/dev/null || true
            # Output Docker status to static text file for debugging
            echo "--- DOCKER INSPECT AUTH ---" > /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
            docker inspect supabase-auth >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
            echo "--- DOCKER PS -A ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
            docker ps -a >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
            echo "--- DOCKER COMPOSE CONFIG ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
            cd /root/supabase/docker
            if docker compose version &> /dev/null; then
              docker compose config >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
              echo "--- DOCKER COMPOSE PS ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
              docker compose ps >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
              echo "--- DOCKER COMPOSE LOGS AUTH ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
              docker compose logs --tail=50 auth >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
            elif command -v docker-compose &> /dev/null; then
              docker-compose config >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
              echo "--- DOCKER COMPOSE PS ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
              docker-compose ps >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
              echo "--- DOCKER COMPOSE LOGS AUTH ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
              docker-compose logs --tail=50 auth >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1 || true
            fi
            cd /home/dndjursoc/htdocs/dndjursoc.com.ar
            echo "Deploy completado: $(git log --oneline -1)"




