name: Deploy to DonWeb VPS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (git pull + build en servidor)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.58.102.187
          username: root
          password: ${{ secrets.DEPLOY_ROOT_PASSWORD }}
          port: 5696
          script: |
            git config --global --add safe.directory /home/dndjursoc/htdocs/dndjursoc.com.ar
            cd /home/dndjursoc/htdocs/dndjursoc.com.ar
            if [ ! -d ".git" ]; then
              echo "No .git folder found. Reinitializing repository..."
              git init
              git remote add origin https://github.com/tomsonArrua7/dndderecho-main.git
              git fetch
              git checkout -f master
            else
              git pull origin master
            fi

            # Auto-extract local self-hosted Supabase ANON_KEY and create .env
            echo "Extracting local Supabase credentials from Docker env..."
            if [ -f "/root/supabase/docker/.env" ]; then
              LOCAL_ANON_KEY=$(grep '^ANON_KEY=' /root/supabase/docker/.env | cut -d'=' -f2- | tr -d '"\r\n' | sed 's/^"//;s/"$//')
              if [ -n "$LOCAL_ANON_KEY" ]; then
                echo "VITE_SUPABASE_URL=\"https://api.dndjursoc.com.ar\"" > .env
                echo "VITE_SUPABASE_ANON_KEY=\"$LOCAL_ANON_KEY\"" >> .env
                echo "VITE_TURNSTILE_SITE_KEY=\"0x4AAAAAAD5z1Imm9ecQi4tW\"" >> .env
                echo "Successfully generated .env file automatically."
              else
                echo "WARNING: ANON_KEY variable not found inside /root/supabase/docker/.env"
              fi
            else
              echo "WARNING: /root/supabase/docker/.env file not found"
            fi
            # Configure Google OAuth variables inside /root/supabase/docker/.env
            if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ] && [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
              if [ -f "/root/supabase/docker/.env" ]; then
                echo "Configuring Google OAuth inside self-hosted Supabase..."
                # Remove old Google values if they exist
                sed -i '/^GOTRUE_EXTERNAL_GOOGLE_/d' /root/supabase/docker/.env
                # Append new Google values
                echo 'GOTRUE_EXTERNAL_GOOGLE_ENABLED="true"' >> /root/supabase/docker/.env
                echo 'GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"' >> /root/supabase/docker/.env
                echo 'GOTRUE_EXTERNAL_GOOGLE_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"' >> /root/supabase/docker/.env
                echo 'GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI="https://api.dndjursoc.com.ar/auth/v1/callback"' >> /root/supabase/docker/.env
                
                # Restart Supabase containers to apply env changes
                echo "Re-creating Supabase containers to apply new env variables..."
                cd /root/supabase/docker
                if command -v docker-compose &> /dev/null; then
                  docker-compose up -d
                else
                  docker compose up -d
                fi
                cd /home/dndjursoc/htdocs/dndjursoc.com.ar
              else
                echo "WARNING: /root/supabase/docker/.env not found, could not configure Google OAuth"
              fi
            else
              echo "INFO: Google OAuth secrets not set in GitHub. Skipping server-side configuration."
            fi
            npm ci --prefer-offline 2>/dev/null || npm install
            npm run build
            mkdir -p templates && cp -r dist/templates/* templates/ 2>/dev/null || true
            cp -r supabase/functions/mass-mailing /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/send-match-email /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/calendario-ics /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/send-recovery-email /root/supabase/docker/volumes/functions/
            cp -r supabase/functions/asistente /root/supabase/docker/volumes/functions/
            # Output Docker status to static text file for debugging
            echo "--- DOCKER INSPECT AUTH ---" > /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
            docker inspect supabase-auth >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1
            echo "--- DOCKER PS ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
            docker ps >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1
            echo "--- DOCKER COMPOSE PS ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
            cd /root/supabase/docker
            if command -v docker-compose &> /dev/null; then
              docker-compose ps >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1
              echo "--- DOCKER COMPOSE LOGS AUTH ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
              docker-compose logs --tail=50 auth >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1
            else
              docker compose ps >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1
              echo "--- DOCKER COMPOSE LOGS AUTH ---" >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt
              docker compose logs --tail=50 auth >> /home/dndjursoc/htdocs/dndjursoc.com.ar/dist/docker-log.txt 2>&1
            fi
            cd /home/dndjursoc/htdocs/dndjursoc.com.ar
            echo "Deploy completado: $(git log --oneline -1)"




